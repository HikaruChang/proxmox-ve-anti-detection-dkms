# pve-qemu-anti-detection configuration
#
# This file is sourced by the pve-qemu-anti-detection script.
# Uncomment and modify settings as needed.

# PVE QEMU source git repository
# PVE_QEMU_GIT="git://git.proxmox.com/git/pve-qemu.git"

# Build directory (needs several GB of free space)
# BUILD_DIR="/var/lib/pve-qemu-anti-detection/build"
# Number of parallel build jobs (0 = auto-detect based on nproc)
# BUILD_JOBS=0
# Auto-rebuild when pve-qemu-kvm is updated via apt (yes/no)
# Set to "no" to only rebuild manually
# AUTO_REBUILD="yes"

# China mainland mirror mode (1 = enable, 0 = disable)
# Uses GitHub mirrors instead of git.proxmox.com for faster downloads in China
# Equivalent to passing --cn flag on the command line
# USE_CN_MIRROR=0